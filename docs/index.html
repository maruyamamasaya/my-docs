<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <title>メモる図書館</title>

  <meta
    name="description"
    content="読書メモと知識をまとめた個人Wiki"
  >

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#090b10">
  <meta name="color-scheme" content="dark">

  <!-- Docsify標準テーマ -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/dark.css"
  >

  <!-- 独自デザイン -->
  <link rel="stylesheet" href="custom.css">
</head>

<body>
  <noscript>
    このサイトを表示するにはJavaScriptを有効にしてください。
  </noscript>

  <!-- 読み込み中の表示 -->
  <div id="app">
    <div class="initial-loading">
      <div class="initial-loading__icon">📚</div>
      <div class="initial-loading__title">メモる図書館</div>
      <div class="initial-loading__text">
        本棚を読み込んでいます……
      </div>
    </div>
  </div>

  <script>
    window.$docsify = {
      /**
       * 基本設定
       */
      name: 'メモる図書館',
      nameLink: '#/',
      repo: '',
      homepage: 'README.md',

      /**
       * ナビゲーション
       */
      auto2top: true,
      maxLevel: 4,
      subMaxLevel: 3,
      relativePath: false,

      /**
       * サイドバー
       *
       * _sidebar.mdを作成したあとで、
       * falseからtrueへ変更できます。
       */
      loadSidebar: false,

      /**
       * ページ表示
       */
      executeScript: false,
      mergeNavbar: true,
      topMargin: 24,

      /**
       * 外部リンク
       */
      externalLinkTarget: '_blank',
      externalLinkRel: 'noopener noreferrer',

      /**
       * 404表示
       */
      notFoundPage: '_404.md',

      /**
       * 検索
       */
      search: {
        paths: 'auto',
        placeholder: 'タイトルや本文を検索',
        noData: '該当するノートが見つかりません',
        depth: 4,
        hideOtherSidebarContent: false,

        pathNamespaces: [
          '/my-docs'
        ]
      },

      /**
       * Markdown設定
       */
      markdown: {
        smartypants: true
      },

      /**
       * ページ送り
       */
      pagination: {
        previousText: '前のノート',
        nextText: '次のノート',
        crossChapter: true,
        crossChapterText: true
      },

      /**
       * 文字数表示
       */
      count: {
        countable: true,
        fontsize: '0.82rem',
        color: '#7f899b',
        language: 'japanese'
      },

      /**
       * コピー機能
       */
      copyCode: {
        buttonText: 'コピー',
        errorText: 'コピーできませんでした',
        successText: 'コピーしました'
      }
    };
  </script>

  <!--
    Obsidian Wikiリンク変換プラグイン

    Docsify本体より先に読み込む必要があります。
  -->
  <script src="obsidian-wikilinks.js"></script>

  <!-- Docsify本体 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>

  <!-- 全文検索 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>

  <!-- 絵文字 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/emoji.min.js"></script>

  <!-- コードコピー -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3/dist/docsify-copy-code.min.js"></script>

  <!-- 前後ページ -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>

  <!-- 文字数・読了時間 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-count@1/dist/countable.min.js"></script>
</body>
</html>
